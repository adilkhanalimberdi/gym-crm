# Database (H2 in-memory by default; to use another DBMS change these values and the JDBC driver dependency)
db.url=jdbc:h2:mem:gymcrm;DB_CLOSE_DELAY=-1
db.username=sa
db.password=
db.pool.size=5

# Hibernate
# create-drop builds the schema from the entities on startup and runs import.sql (training types)
hibernate.hbm2ddl.auto=create-drop
hibernate.format_sql=false
