spring.application.name=gym-crm

# Environments: local (default), dev, stg, prod; each profile file holds its own database settings
spring.profiles.default=local

spring.jpa.open-in-view=false
# The local profile builds the schema from the entities; the deployed ones turn Flyway on
spring.flyway.enabled=false

# Every log line carries the transaction id of the REST call it belongs to
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{transactionId:-}] %logger{36} - %msg%n
# INFO by default; DEBUG (lookups, request and response bodies) comes with the "debug" profile
# (--spring.profiles.active=local,debug) or the environment variable LOGGING_LEVEL_COM_EPAM_GYMCRM=DEBUG
logging.level.com.epam.gymcrm=INFO

# Actuator: /actuator/health, /actuator/info, /actuator/metrics and /actuator/prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Swagger UI: /swagger-ui.html, OpenAPI document: /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
