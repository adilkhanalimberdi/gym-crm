spring.application.name=gym-crm

# Database (H2 in-memory by default; to use another DBMS change these values and the JDBC driver dependency)
spring.datasource.url=jdbc:h2:mem:gymcrm;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# create-drop builds the schema from the entities on startup and runs import.sql (training types)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Swagger UI: /swagger-ui.html, OpenAPI document: /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
