# Local development: in-memory H2, nothing to install
spring.datasource.url=jdbc:h2:mem:gymcrm;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# create-drop builds the schema from the entities on startup and runs import.sql (training types)
spring.jpa.hibernate.ddl-auto=create-drop

management.endpoint.health.show-details=always
